name: Flutter App CI/CD

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
    paths:
      - 'mobile_app/**'
      - '.github/workflows/app.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'mobile_app/**'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Analyze Code
        run: flutter analyze

      - name: Run Unit Tests
        run: flutter test

      - name: Build Android APK
        run: flutter build apk --split-per-abi

      - name: Build Flutter Web
        run: flutter build web --base-href "/${{ github.event.repository.name }}/"

      - name: Archive Web Build
        run: zip -r kyndora-web.zip build/web/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: flutter-apk
          path: mobile_app/build/app/outputs/flutter-apk/*.apk
          retention-days: 7

      - name: Deploy PWA to GitHub Pages
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: mobile_app/build/web 

      - name: Update Rolling Pre-Release (Beta)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: beta
          name: "Beta / Development Build"
          body: "Automatic Build of newest commit. Last Update: ${{ github.event.head_commit.message }}"
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: |
            mobile_app/build/app/outputs/flutter-apk/*.apk
            mobile_app/kyndora-web.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            mobile_app/build/app/outputs/flutter-apk/*.apk
            mobile_app/kyndora-web.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
