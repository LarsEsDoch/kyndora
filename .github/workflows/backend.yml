name: FastAPI Backend CI/CD

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'backend/**'

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest ruff

      - name: Lint and Format with Ruff
        run: |
          python -m ruff check .
          python -m ruff format --check . || true

      - name: Run Tests with pytest
        run: python -m pytest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase Repository Owner
        id: repository_owner
        run: echo "owner=${OWNER,,}" >> $GITHUB_OUTPUT
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ github.ref_type == 'tag' && format('ghcr.io/{0}/kyndora-backend:latest', steps.repository_owner.outputs.owner) || '' }}
            ${{ github.ref_type == 'tag' && format('ghcr.io/{0}/kyndora-backend:{1}', steps.repository_owner.outputs.owner, github.ref_name) || '' }}
            ${{ github.ref_type == 'branch' && format('ghcr.io/{0}/kyndora-backend:beta', steps.repository_owner.outputs.owner) || '' }}
