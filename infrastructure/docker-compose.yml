services:
  db:
    image: postgres:17-alpine
    container_name: kyndora_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret123}
      POSTGRES_DB: connect_box
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin} -d connect_box"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kyndora_net

  mqtt:
    image: iegomez/mosquitto-go-auth:latest
    container_name: kyndora_mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "8883:8883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/etc/mosquitto/mosquitto.conf
      - ./mosquitto/data:/mosquitto/data
    networks:
      - kyndora_net

networks:
  kyndora_net:
    driver: bridge